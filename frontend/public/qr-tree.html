<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>NastaGhar • Isometric 3D Tree to Scannable QR</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #faf7f2;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            touch-action: manipulation;
        }

        #viewport-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
            background: radial-gradient(circle at 50% 40%, #ffffff 0%, #f6f1ea 60%, #eae2d5 100%);
            cursor: pointer;
        }

        #webgl-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none;
            z-index: 1;
        }

        #qr-card-container {
            position: relative;
            z-index: 2;
            width: min(76vw, 76vh, 340px);
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            border-radius: 24px;
            background: #ffffff;
            box-shadow: 0 20px 48px -12px rgba(25, 45, 30, 0.15), 0 4px 16px rgba(0, 0, 0, 0.04);
            opacity: 0;
            transform: scale(0.92);
            transition: opacity 0.25s ease-out, transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            padding: 18px;
        }

        #qr-card-container.qr-visible {
            opacity: 1;
            transform: scale(1);
        }

        #qr-exact-canvas {
            width: 100%;
            height: 100%;
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        .vignette {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: radial-gradient(circle at 50% 50%, transparent 60%, rgba(95, 110, 85, 0.08) 100%);
            z-index: 3;
        }
    </style>
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        if (typeof THREE === 'undefined') {
            document.write('<script src="https://unpkg.com/three@0.128.0/build/three.min.js"><\/script>');
        }
    </script>
</head>
<body>

    <div id="viewport-wrapper">
        <canvas id="webgl-canvas"></canvas>
        <div id="qr-card-container">
            <canvas id="qr-exact-canvas"></canvas>
        </div>
        <div class="vignette"></div>
    </div>

    <script>
    /**
     * Standalone ISO/IEC 18004 Standard QR Code Matrix Engine
     * Encodes http://nastaghar.devs.surf/ to bit-matrix with Error Correction.
     */
    const QRCodeLib = (function() {
        function QR8bitByte(data) {
            this.mode = 4;
            this.data = data;
        }
        QR8bitByte.prototype = {
            getLength: function() { return this.data.length; },
            write: function(buffer) {
                for (var i = 0; i < this.data.length; i++) buffer.put(this.data.charCodeAt(i), 8);
            }
        };

        function QRCode(typeNumber, errorCorrectLevel) {
            this.typeNumber = typeNumber;
            this.errorCorrectLevel = errorCorrectLevel;
            this.modules = null;
            this.moduleCount = 0;
            this.dataCache = null;
            this.dataList = [];
        }

        QRCode.prototype = {
            addData: function(data) {
                this.dataList.push(new QR8bitByte(data));
                this.dataCache = null;
            },
            isDark: function(row, col) { return this.modules[row][col]; },
            getModuleCount: function() { return this.moduleCount; },
            make: function() {
                if (this.typeNumber < 1) {
                    var typeNumber = 1;
                    for (typeNumber = 1; typeNumber < 40; typeNumber++) {
                        var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, this.errorCorrectLevel);
                        var buffer = new QRBitBuffer();
                        var totalDataCount = 0;
                        for (var i = 0; i < rsBlocks.length; i++) totalDataCount += rsBlocks[i].dataCount;
                        for (var i = 0; i < this.dataList.length; i++) {
                            var data = this.dataList[i];
                            buffer.put(data.mode, 4);
                            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.mode, typeNumber));
                            data.write(buffer);
                        }
                        if (buffer.getLengthInBits() <= totalDataCount * 8) break;
                    }
                    this.typeNumber = typeNumber;
                }
                this.makeImpl(false, this.getBestMaskPattern());
            },
            makeImpl: function(test, maskPattern) {
                this.moduleCount = this.typeNumber * 4 + 17;
                this.modules = new Array(this.moduleCount);
                for (var row = 0; row < this.moduleCount; row++) {
                    this.modules[row] = new Array(this.moduleCount);
                    for (var col = 0; col < this.moduleCount; col++) this.modules[row][col] = null;
                }
                this.setupPositionProbePattern(0, 0);
                this.setupPositionProbePattern(this.moduleCount - 7, 0);
                this.setupPositionProbePattern(0, this.moduleCount - 7);
                this.setupPositionAdjustPattern();
                this.setupTimingPattern();
                this.setupTypeInfo(test, maskPattern);
                if (this.typeNumber >= 7) this.setupTypeNumber(test);
                if (this.dataCache == null) {
                    this.dataCache = QRCode.createData(this.typeNumber, this.errorCorrectLevel, this.dataList);
                }
                this.mapData(this.dataCache, maskPattern);
            },
            setupPositionProbePattern: function(row, col) {
                for (var r = -1; r <= 7; r++) {
                    if (row + r <= -1 || this.moduleCount <= row + r) continue;
                    for (var c = -1; c <= 7; c++) {
                        if (col + c <= -1 || this.moduleCount <= col + c) continue;
                        if ((0 <= r && r <= 6 && (c == 0 || c == 6)) ||
                            (0 <= c && c <= 6 && (r == 0 || r == 6)) ||
                            (2 <= r && r <= 4 && 2 <= c && c <= 4)) {
                            this.modules[row + r][col + c] = true;
                        } else {
                            this.modules[row + r][col + c] = false;
                        }
                    }
                }
            },
            getBestMaskPattern: function() {
                var minLostPoint = 0, pattern = 0;
                for (var i = 0; i < 8; i++) {
                    this.makeImpl(true, i);
                    var lostPoint = QRUtil.getLostPoint(this);
                    if (i == 0 || minLostPoint > lostPoint) {
                        minLostPoint = lostPoint;
                        pattern = i;
                    }
                }
                return pattern;
            },
            setupTimingPattern: function() {
                for (var r = 8; r < this.moduleCount - 8; r++) {
                    if (this.modules[r][6] != null) continue;
                    this.modules[r][6] = (r % 2 == 0);
                }
                for (var c = 8; c < this.moduleCount - 8; c++) {
                    if (this.modules[6][c] != null) continue;
                    this.modules[6][c] = (c % 2 == 0);
                }
            },
            setupPositionAdjustPattern: function() {
                var pos = QRUtil.getPatternPosition(this.typeNumber);
                for (var i = 0; i < pos.length; i++) {
                    for (var j = 0; j < pos.length; j++) {
                        var row = pos[i], col = pos[j];
                        if (this.modules[row][col] != null) continue;
                        for (var r = -2; r <= 2; r++) {
                            for (var c = -2; c <= 2; c++) {
                                if (r == -2 || r == 2 || c == -2 || c == 2 || (r == 0 && c == 0)) {
                                    this.modules[row + r][col + c] = true;
                                } else {
                                    this.modules[row + r][col + c] = false;
                                }
                            }
                        }
                    }
                }
            },
            setupTypeNumber: function(test) {
                var bits = QRUtil.getBCHTypeNumber(this.typeNumber);
                for (var i = 0; i < 18; i++) {
                    var mod = (!test && ((bits >> i) & 1) == 1);
                    this.modules[Math.floor(i / 3)][i % 3 + this.moduleCount - 8 - 3] = mod;
                    this.modules[i % 3 + this.moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
                }
            },
            setupTypeInfo: function(test, maskPattern) {
                var data = (this.errorCorrectLevel << 3) | maskPattern;
                var bits = QRUtil.getBCHTypeInfo(data);
                for (var i = 0; i < 15; i++) {
                    var mod = (!test && ((bits >> i) & 1) == 1);
                    if (i < 6) this.modules[i][8] = mod;
                    else if (i < 8) this.modules[i + 1][8] = mod;
                    else this.modules[this.moduleCount - 15 + i][8] = mod;
                    if (i < 8) this.modules[8][this.moduleCount - i - 1] = mod;
                    else if (i < 9) this.modules[8][15 - i - 1 + 1] = mod;
                    else this.modules[8][15 - i - 1] = mod;
                }
                this.modules[this.moduleCount - 8][8] = (!test);
            },
            mapData: function(data, maskPattern) {
                var inc = -1, row = this.moduleCount - 1, bitIndex = 7, byteIndex = 0;
                for (var col = this.moduleCount - 1; col > 0; col -= 2) {
                    if (col == 6) col--;
                    while (true) {
                        for (var c = 0; c < 2; c++) {
                            if (this.modules[row][col - c] == null) {
                                var dark = false;
                                if (byteIndex < data.length) dark = (((data[byteIndex] >>> bitIndex) & 1) == 1);
                                var mask = QRUtil.getMask(maskPattern, row, col - c);
                                if (mask) dark = !dark;
                                this.modules[row][col - c] = dark;
                                bitIndex--;
                                if (bitIndex == -1) {
                                    byteIndex++;
                                    bitIndex = 7;
                                }
                            }
                        }
                        row += inc;
                        if (row < 0 || this.moduleCount <= row) {
                            row -= inc;
                            inc = -inc;
                            break;
                        }
                    }
                }
            }
        };

        QRCode.createData = function(typeNumber, errorCorrectLevel, dataList) {
            var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectLevel);
            var buffer = new QRBitBuffer();
            for (var i = 0; i < dataList.length; i++) {
                var data = dataList[i];
                buffer.put(data.mode, 4);
                buffer.put(data.getLength(), QRUtil.getLengthInBits(data.mode, typeNumber));
                data.write(buffer);
            }
            var totalDataCount = 0;
            for (var i = 0; i < rsBlocks.length; i++) totalDataCount += rsBlocks[i].dataCount;
            if (buffer.getLengthInBits() > totalDataCount * 8) throw new Error('Overflow');
            if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) buffer.put(0, 4);
            while (buffer.getLengthInBits() % 8 != 0) buffer.putBit(false);
            while (true) {
                if (buffer.getLengthInBits() >= totalDataCount * 8) break;
                buffer.put(0xEC, 8);
                if (buffer.getLengthInBits() >= totalDataCount * 8) break;
                buffer.put(0x11, 8);
            }
            return QRCode.createBytes(buffer, rsBlocks);
        };

        QRCode.createBytes = function(buffer, rsBlocks) {
            var offset = 0, maxDcCount = 0, maxEcCount = 0;
            var dcdata = new Array(rsBlocks.length), ecdata = new Array(rsBlocks.length);
            for (var r = 0; r < rsBlocks.length; r++) {
                var dcCount = rsBlocks[r].dataCount, ecCount = rsBlocks[r].totalCount - dcCount;
                maxDcCount = Math.max(maxDcCount, dcCount);
                maxEcCount = Math.max(maxEcCount, ecCount);
                dcdata[r] = new Array(dcCount);
                for (var i = 0; i < dcdata[r].length; i++) dcdata[r][i] = 0xff & buffer.buffer[i + offset];
                offset += dcCount;
                var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
                var rawPoly = new QRPolynomial(dcdata[r], rsPoly.getLength() - 1);
                var modPoly = rawPoly.mod(rsPoly);
                ecdata[r] = new Array(rsPoly.getLength() - 1);
                for (var i = 0; i < ecdata[r].length; i++) {
                    var modIndex = i + modPoly.getLength() - ecdata[r].length;
                    ecdata[r][i] = (modIndex >= 0) ? modPoly.get(modIndex) : 0;
                }
            }
            var totalCodeCount = 0;
            for (var i = 0; i < rsBlocks.length; i++) totalCodeCount += rsBlocks[i].totalCount;
            var data = new Array(totalCodeCount), index = 0;
            for (var i = 0; i < maxDcCount; i++) {
                for (var r = 0; r < rsBlocks.length; r++) {
                    if (i < dcdata[r].length) data[index++] = dcdata[r][i];
                }
            }
            for (var i = 0; i < maxEcCount; i++) {
                for (var r = 0; r < rsBlocks.length; r++) {
                    if (i < ecdata[r].length) data[index++] = ecdata[r][i];
                }
            }
            return data;
        };

        var QRMath = {
            glog: function(n) { if (n < 1) throw new Error('glog'); return QRMath.LOG_TABLE[n]; },
            gexp: function(n) {
                while (n < 0) n += 255;
                while (n >= 256) n -= 255;
                return QRMath.EXP_TABLE[n];
            },
            EXP_TABLE: new Array(256),
            LOG_TABLE: new Array(256)
        };
        for (var i = 0; i < 8; i++) QRMath.EXP_TABLE[i] = 1 << i;
        for (var i = 8; i < 256; i++) QRMath.EXP_TABLE[i] = QRMath.EXP_TABLE[i - 4] ^ QRMath.EXP_TABLE[i - 5] ^ QRMath.EXP_TABLE[i - 6] ^ QRMath.EXP_TABLE[i - 8];
        for (var i = 0; i < 255; i++) QRMath.LOG_TABLE[QRMath.EXP_TABLE[i]] = i;

        function QRPolynomial(num, shift) {
            var offset = 0;
            while (offset < num.length && num[offset] == 0) offset++;
            this.num = new Array(num.length - offset + shift);
            for (var i = 0; i < num.length - offset; i++) this.num[i] = num[i + offset];
        }
        QRPolynomial.prototype = {
            get: function(index) { return this.num[index]; },
            getLength: function() { return this.num.length; },
            multiply: function(e) {
                var num = new Array(this.getLength() + e.getLength() - 1);
                for (var i = 0; i < this.getLength(); i++) {
                    for (var j = 0; j < e.getLength(); j++) num[i + j] ^= QRMath.gexp(QRMath.glog(this.get(i)) + QRMath.glog(e.get(j)));
                }
                return new QRPolynomial(num, 0);
            },
            mod: function(e) {
                if (this.getLength() - e.getLength() < 0) return this;
                var ratio = QRMath.glog(this.get(0)) - QRMath.glog(e.get(0));
                var num = new Array(this.getLength());
                for (var i = 0; i < this.getLength(); i++) num[i] = this.get(i);
                for (var i = 0; i < e.getLength(); i++) num[i] ^= QRMath.gexp(QRMath.glog(e.get(i)) + ratio);
                return new QRPolynomial(num, 0).mod(e);
            }
        };

        function QRRSBlock(totalCount, dataCount) {
            this.totalCount = totalCount;
            this.dataCount = dataCount;
        }
        QRRSBlock.RS_BLOCK_TABLE = [
            [1, 26, 19], [1, 26, 16], [1, 26, 13], [1, 26, 9],
            [1, 44, 34], [1, 44, 28], [1, 44, 22], [1, 44, 16],
            [1, 70, 55], [1, 70, 44], [2, 35, 17], [2, 35, 13],
            [1, 100, 80], [2, 50, 32], [2, 50, 24], [4, 25, 9],
            [1, 134, 108], [2, 67, 43], [2, 33, 15, 2, 34, 16], [2, 33, 11, 2, 34, 12],
            [2, 86, 68], [4, 43, 27], [4, 43, 19], [4, 43, 15],
            [2, 98, 78], [4, 49, 31], [2, 32, 14, 4, 33, 15], [4, 39, 13, 1, 40, 14],
            [2, 121, 97], [2, 60, 38, 2, 61, 39], [4, 40, 18, 2, 41, 19], [4, 40, 14, 2, 41, 15]
        ];
        QRRSBlock.getRSBlocks = function(typeNumber, errorCorrectLevel) {
            var rsBlock = QRRSBlock.getRsBlockTable(typeNumber, errorCorrectLevel);
            var length = rsBlock.length / 3, list = [];
            for (var i = 0; i < length; i++) {
                var count = rsBlock[i * 3 + 0], totalCount = rsBlock[i * 3 + 1], dataCount = rsBlock[i * 3 + 2];
                for (var j = 0; j < count; j++) list.push(new QRRSBlock(totalCount, dataCount));
            }
            return list;
        };
        QRRSBlock.getRsBlockTable = function(typeNumber, errorCorrectLevel) {
            switch (errorCorrectLevel) {
                case 1: return QRRSBlock.RS_BLOCK_TABLE[(typeNumber - 1) * 4 + 0];
                case 0: return QRRSBlock.RS_BLOCK_TABLE[(typeNumber - 1) * 4 + 1];
                case 3: return QRRSBlock.RS_BLOCK_TABLE[(typeNumber - 1) * 4 + 2];
                case 2: return QRRSBlock.RS_BLOCK_TABLE[(typeNumber - 1) * 4 + 3];
            }
        };

        function QRBitBuffer() {
            this.buffer = [];
            this.length = 0;
        }
        QRBitBuffer.prototype = {
            get: function(index) {
                var bufIndex = Math.floor(index / 8);
                return ((this.buffer[bufIndex] >>> (7 - index % 8)) & 1) == 1;
            },
            put: function(num, length) {
                for (var i = 0; i < length; i++) this.putBit(((num >>> (length - i - 1)) & 1) == 1);
            },
            getLengthInBits: function() { return this.length; },
            putBit: function(bit) {
                var bufIndex = Math.floor(this.length / 8);
                if (this.buffer.length <= bufIndex) this.buffer.push(0);
                if (bit) this.buffer[bufIndex] |= (0x80 >>> (this.length % 8));
                this.length++;
            }
        };

        var QRUtil = {
            PATTERN_POSITION_TABLE: [
                [], [6, 18], [6, 22], [6, 26], [6, 30], [6, 34],
                [6, 22, 38], [6, 24, 42], [6, 26, 46], [6, 28, 50]
            ],
            getPatternPosition: function(typeNumber) {
                return QRUtil.PATTERN_POSITION_TABLE[typeNumber - 1] || [];
            },
            getMask: function(maskPattern, i, j) {
                switch (maskPattern) {
                    case 0: return (i + j) % 2 == 0;
                    case 1: return i % 2 == 0;
                    case 2: return j % 3 == 0;
                    case 3: return (i + j) % 3 == 0;
                    case 4: return (Math.floor(i / 2) + Math.floor(j / 3)) % 2 == 0;
                    case 5: return (i * j) % 2 + (i * j) % 3 == 0;
                    case 6: return ((i * j) % 2 + (i * j) % 3) % 2 == 0;
                    case 7: return ((i * j) % 3 + (i + j) % 2) % 2 == 0;
                }
            },
            getErrorCorrectPolynomial: function(errorCorrectLength) {
                var a = new QRPolynomial([1], 0);
                for (var i = 0; i < errorCorrectLength; i++) a = a.multiply(new QRPolynomial([1, QRMath.gexp(i)], 0));
                return a;
            },
            getLengthInBits: function(mode, type) {
                if (1 <= type && type < 10) {
                    switch (mode) { case 1: return 10; case 2: return 9; case 4: return 8; case 8: return 8; }
                } else {
                    switch (mode) { case 1: return 12; case 2: return 11; case 4: return 16; case 8: return 10; }
                }
            },
            getLostPoint: function(qrCode) {
                var moduleCount = qrCode.getModuleCount(), lostPoint = 0;
                for (var row = 0; row < moduleCount; row++) {
                    for (var col = 0; col < moduleCount; col++) {
                        var sameCount = 0, dark = qrCode.isDark(row, col);
                        for (var r = -1; r <= 1; r++) {
                            if (row + r < 0 || moduleCount <= row + r) continue;
                            for (var c = -1; c <= 1; c++) {
                                if (col + c < 0 || moduleCount <= col + c || (r == 0 && c == 0)) continue;
                                if (dark == qrCode.isDark(row + r, col + c)) sameCount++;
                            }
                        }
                        if (sameCount > 5) lostPoint += (3 + sameCount - 5);
                    }
                }
                return lostPoint;
            },
            getBCHTypeInfo: function(data) {
                var d = data << 10;
                while (QRUtil.getBCHDigit(d) - QRUtil.getBCHDigit(1335) >= 0) {
                    d ^= (1335 << (QRUtil.getBCHDigit(d) - QRUtil.getBCHDigit(1335)));
                }
                return ((data << 10) | d) ^ 21522;
            },
            getBCHDigit: function(data) {
                var digit = 0;
                while (data != 0) { digit++; data >>>= 1; }
                return digit;
            }
        };

        return {
            generate: function(url, ecLevel) {
                var qr = new QRCode(0, ecLevel !== undefined ? ecLevel : 0);
                qr.addData(url);
                qr.make();
                var count = qr.getModuleCount(), matrix = [];
                for (var r = 0; r < count; r++) {
                    var row = [];
                    for (var c = 0; c < count; c++) row.push(qr.isDark(r, c));
                    matrix.push(row);
                }
                return {
                    size: count,
                    matrix: matrix,
                    isDark: function(r, c) { return matrix[r][c]; }
                };
            }
        };
    })();

    /* ================================================================
     * REBUILT SCENE — Compact Miniature Isometric Game Tree
     * ================================================================ */
    (function() {
        const TARGET_URL = "http://nastaghar.devs.surf/";
        const wrapper = document.getElementById("viewport-wrapper");
        const webglCanvas = document.getElementById("webgl-canvas");
        const qrCardContainer = document.getElementById("qr-card-container");
        const qrExactCanvas = document.getElementById("qr-exact-canvas");

        const ANIM_DURATION = 950; // ms — fast snappy morph

        // QR Code Matrix Generation (Level M)
        const qrData = QRCodeLib.generate(TARGET_URL, 0);
        const qrSize = qrData.size;

        // BOTANICAL PALETTE
        const COLOR_FOREST_GREEN = "#0d3618";
        const COLOR_CHERRY_PINK  = "#880e4f";
        const COLOR_PORCELAIN    = "#ffffff";

        const THREE_FOREST_GREEN = new THREE.Color(0x0d3618);
        const THREE_CHERRY_PINK  = new THREE.Color(0x880e4f);

        function getModuleTheme(r, c) {
            const isFinder = (r < 7 && c < 7) || (r < 7 && c >= qrSize - 7) || (r >= qrSize - 7 && c < 7);
            const isFinderCenter = (r >= 2 && r <= 4 && c >= 2 && c <= 4) ||
                                   (r >= 2 && r <= 4 && c >= qrSize - 5 && c <= qrSize - 3) ||
                                   (r >= qrSize - 5 && r <= qrSize - 3 && c >= 2 && c <= 4);
            const isTiming = (r === 6 || c === 6);

            if (isFinder && !isFinderCenter) {
                return { hex: COLOR_FOREST_GREEN, threeColor: THREE_FOREST_GREEN };
            } else if (isFinderCenter) {
                return { hex: COLOR_CHERRY_PINK, threeColor: THREE_CHERRY_PINK };
            } else if (isTiming) {
                return { hex: COLOR_FOREST_GREEN, threeColor: THREE_FOREST_GREEN };
            } else {
                const isPink = ((r + c) % 3 === 0) || ((r * c) % 5 === 0);
                return {
                    hex: isPink ? COLOR_CHERRY_PINK : COLOR_FOREST_GREEN,
                    threeColor: isPink ? THREE_CHERRY_PINK : THREE_FOREST_GREEN
                };
            }
        }

        // Render Crisp 2D Botanical Scannable QR on High-DPI Canvas
        function renderExact2DQR() {
            const dpr = Math.min(window.devicePixelRatio || 1, 3);
            const rect = qrExactCanvas.getBoundingClientRect();
            const w = Math.floor(rect.width * dpr);
            const h = Math.floor(rect.height * dpr);

            qrExactCanvas.width = w;
            qrExactCanvas.height = h;

            const ctx = qrExactCanvas.getContext("2d");
            ctx.imageSmoothingEnabled = false;
            ctx.clearRect(0, 0, w, h);

            const quietModules = 4;
            const totalModulesWithQuiet = qrSize + (quietModules * 2);
            const cellSize = Math.floor(w / totalModulesWithQuiet);
            const qrPixelSpan = cellSize * qrSize;
            const offsetX = Math.floor((w - qrPixelSpan) / 2);
            const offsetY = Math.floor((h - qrPixelSpan) / 2);

            ctx.fillStyle = COLOR_PORCELAIN;
            ctx.fillRect(0, 0, w, h);

            for (let r = 0; r < qrSize; r++) {
                for (let c = 0; c < qrSize; c++) {
                    if (qrData.isDark(r, c)) {
                        const theme = getModuleTheme(r, c);
                        ctx.fillStyle = theme.hex;
                        ctx.fillRect(offsetX + c * cellSize, offsetY + r * cellSize, cellSize, cellSize);
                    }
                }
            }
        }

        const qrDarkModules = [];
        for (let r = 0; r < qrSize; r++) {
            for (let c = 0; c < qrSize; c++) {
                if (qrData.isDark(r, c)) {
                    qrDarkModules.push({ r, c, theme: getModuleTheme(r, c) });
                }
            }
        }

        // ========================================================
        // THREE.JS SCENE — TRUE ISOMETRIC MINIATURE GAME WORLD
        // ========================================================
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0xf6f1ea, 0.012);

        const camera = new THREE.PerspectiveCamera(32, window.innerWidth / window.innerHeight, 0.1, 1000);

        // TRUE ISOMETRIC CAMERA — elevated, looking down at ~55-60°
        // This creates a diamond-shaped ground platform on screen
        const ISO_DIST = 16;
        const ISO_ANGLE = Math.PI / 5.5; // ~33° from horizontal → looking down at ~57°
        const ISO_AZIMUTH = Math.PI / 4;  // 45° — classic isometric diagonal

        const camPosTree = new THREE.Vector3(
            ISO_DIST * Math.cos(ISO_ANGLE) * Math.sin(ISO_AZIMUTH),
            ISO_DIST * Math.sin(ISO_ANGLE) + 4,
            ISO_DIST * Math.cos(ISO_ANGLE) * Math.cos(ISO_AZIMUTH)
        );
        const camLookTree = new THREE.Vector3(0, 1.8, 0); // Look at mid-tree height

        // Final Top-Down Camera for QR
        const CAM_QR_Z = 22;
        const camPosQR = new THREE.Vector3(0, CAM_QR_Z * 0.15, CAM_QR_Z * 0.98);
        const camLookQR = new THREE.Vector3(0, 0, 0);

        camera.position.copy(camPosTree);
        camera.lookAt(camLookTree);

        const renderer = new THREE.WebGLRenderer({ canvas: webglCanvas, antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;

        // Warm Ambient + Directional Lighting
        const ambientLight = new THREE.AmbientLight(0xfff5ea, 0.85);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xfffaea, 1.4);
        sunLight.position.set(10, 20, 10);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 1024;
        sunLight.shadow.mapSize.height = 1024;
        sunLight.shadow.camera.near = 0.5;
        sunLight.shadow.camera.far = 50;
        sunLight.shadow.camera.left = -8;
        sunLight.shadow.camera.right = 8;
        sunLight.shadow.camera.top = 8;
        sunLight.shadow.camera.bottom = -8;
        sunLight.shadow.bias = -0.0004;
        scene.add(sunLight);

        const rimLight = new THREE.DirectionalLight(0xffd8e2, 0.5);
        rimLight.position.set(-10, 8, -10);
        scene.add(rimLight);

        const fillLight = new THREE.DirectionalLight(0xe8f0ff, 0.3);
        fillLight.position.set(-5, 3, 10);
        scene.add(fillLight);

        // ========================================================
        // DIAMOND ISOMETRIC GROUND PLATFORM
        // Rotated 45° so it appears as a diamond/rhombus from the isometric camera
        // ========================================================
        const groundGroup = new THREE.Group();
        scene.add(groundGroup);

        // Main earth/soil block — thick enough to see the side faces
        const TILE_SIZE = 5.0;
        const TILE_DEPTH = 0.8;
        const tileBaseGeo = new THREE.BoxGeometry(TILE_SIZE, TILE_DEPTH, TILE_SIZE);
        const tileBaseMat = new THREE.MeshStandardMaterial({

        });
        const tileBase = new THREE.Mesh(tileBaseGeo, tileBaseMat);
        tileBase.position.y = -TILE_DEPTH / 2;
        tileBase.rotation.y = Math.PI / 4; // 45° rotation for diamond look
        tileBase.receiveShadow = true;
        tileBase.castShadow = true;
        groundGroup.add(tileBase);

        // Darker soil stripe at bottom edge
        const soilEdgeGeo = new THREE.BoxGeometry(TILE_SIZE * 0.98, 0.15, TILE_SIZE * 0.98);
        const soilEdgeMat = new THREE.MeshStandardMaterial({ color: 0x8b7355, roughness: 0.9 });
        const soilEdge = new THREE.Mesh(soilEdgeGeo, soilEdgeMat);
        soilEdge.position.y = -TILE_DEPTH + 0.07;
        soilEdge.rotation.y = Math.PI / 4;
        groundGroup.add(soilEdge);

        // Green grass surface layer on top
        const grassSize = TILE_SIZE * 0.92;
        const grassGeo = new THREE.BoxGeometry(grassSize, 0.08, grassSize);
        const grassMat = new THREE.MeshStandardMaterial({ color: 0x5a8f3c, roughness: 0.85 });
        const grassMesh = new THREE.Mesh(grassGeo, grassMat);
        grassMesh.position.y = 0.04;
        grassMesh.rotation.y = Math.PI / 4;
        grassMesh.receiveShadow = true;
        groundGroup.add(grassMesh);

        // Lighter grass border ring
        const grassBorderGeo = new THREE.BoxGeometry(TILE_SIZE * 0.96, 0.06, TILE_SIZE * 0.96);
        const grassBorderMat = new THREE.MeshStandardMaterial({ color: 0x6da64a, roughness: 0.85 });
        const grassBorder = new THREE.Mesh(grassBorderGeo, grassBorderMat);
        grassBorder.position.y = 0.01;
        grassBorder.rotation.y = Math.PI / 4;
        groundGroup.add(grassBorder);

        // Small decorative grass tufts / tiny bushes around base
        const tuftMat = new THREE.MeshStandardMaterial({ color: 0x4d8030, roughness: 0.9 });
        const tuftGeoBig = new THREE.SphereGeometry(0.12, 5, 4);
        const tuftGeoSmall = new THREE.SphereGeometry(0.08, 4, 3);
        for (let i = 0; i < 20; i++) {
            const ang = (i / 20) * Math.PI * 2 + (Math.random() - 0.5) * 0.3;
            const rad = 1.4 + Math.random() * 0.9;
            const tuft = new THREE.Mesh(
                Math.random() > 0.5 ? tuftGeoBig : tuftGeoSmall,
                tuftMat
            );
            tuft.position.set(Math.cos(ang) * rad, 0.06 + Math.random() * 0.04, Math.sin(ang) * rad);
            tuft.scale.y = 0.6 + Math.random() * 0.3;
            tuft.castShadow = true;
            groundGroup.add(tuft);
        }

        // Tiny pebbles/stones
        const pebbleMat = new THREE.MeshStandardMaterial({ color: 0xb8a88a, roughness: 0.92 });
        const pebbleGeo = new THREE.SphereGeometry(0.04, 4, 3);
        for (let i = 0; i < 12; i++) {
            const ang = Math.random() * Math.PI * 2;
            const rad = 0.6 + Math.random() * 1.2;
            const peb = new THREE.Mesh(pebbleGeo, pebbleMat);
            peb.position.set(Math.cos(ang) * rad, 0.02, Math.sin(ang) * rad);
            peb.scale.set(0.8 + Math.random() * 0.8, 0.4, 0.8 + Math.random() * 0.8);
            groundGroup.add(peb);
        }

        // ========================================================
        // COMPACT MINIATURE TREE — Short trunk + DENSE canopy
        // ========================================================
        const treeGroup = new THREE.Group();
        scene.add(treeGroup);

        const trunkMaterial = new THREE.MeshStandardMaterial({
            color: 0x4a3220,
            roughness: 0.82,
            metalness: 0.05
        });

        const flowerOrigins = [];
        const leafOrigins = [];
        const trunkOrigins = [];

        // Short single continuous trunk — lathe for organic taper
        const TRUNK_HEIGHT = 1.6; // SHORT trunk
        const trunkProfile = new THREE.QuadraticBezierCurve3(
            new THREE.Vector3(0, 0, 0),
            new THREE.Vector3(0.03, TRUNK_HEIGHT * 0.5, 0.02),
            new THREE.Vector3(0.02, TRUNK_HEIGHT, 0.01)
        );
        const trunkPts = trunkProfile.getPoints(8);

        // Build trunk as tapered tube using single TubeGeometry
        const trunkCurve = new THREE.CatmullRomCurve3([
            new THREE.Vector3(0, 0.0, 0),
            new THREE.Vector3(0.04, 0.4, 0.02),
            new THREE.Vector3(0.06, 0.8, -0.01),
            new THREE.Vector3(0.03, 1.2, 0.02),
            new THREE.Vector3(0.0, TRUNK_HEIGHT, 0.0)
        ]);

        // Custom tapered tube via multiple ring segments
        function createTaperedTube(curve, radiusBottom, radiusTop, segments, radialSegs) {
            const pts = [];
            const normals = [];
            const uvs = [];
            const indices = [];

            for (let i = 0; i <= segments; i++) {
                const t = i / segments;
                const p = curve.getPoint(t);
                const tangent = curve.getTangent(t).normalize();
                const radius = radiusBottom + (radiusTop - radiusBottom) * t;

                // Create a basis perpendicular to tangent
                let up = new THREE.Vector3(0, 1, 0);
                if (Math.abs(tangent.dot(up)) > 0.99) up = new THREE.Vector3(1, 0, 0);
                const side = new THREE.Vector3().crossVectors(tangent, up).normalize();
                const outward = new THREE.Vector3().crossVectors(side, tangent).normalize();

                for (let j = 0; j <= radialSegs; j++) {
                    const angle = (j / radialSegs) * Math.PI * 2;
                    const x = p.x + (Math.cos(angle) * side.x + Math.sin(angle) * outward.x) * radius;
                    const y = p.y + (Math.cos(angle) * side.y + Math.sin(angle) * outward.y) * radius;
                    const z = p.z + (Math.cos(angle) * side.z + Math.sin(angle) * outward.z) * radius;
                    pts.push(x, y, z);

                    const nx = (Math.cos(angle) * side.x + Math.sin(angle) * outward.x);
                    const ny = (Math.cos(angle) * side.y + Math.sin(angle) * outward.y);
                    const nz = (Math.cos(angle) * side.z + Math.sin(angle) * outward.z);
                    normals.push(nx, ny, nz);
                    uvs.push(j / radialSegs, t);
                }
            }

            for (let i = 0; i < segments; i++) {
                for (let j = 0; j < radialSegs; j++) {
                    const a = i * (radialSegs + 1) + j;
                    const b = a + radialSegs + 1;
                    indices.push(a, b, a + 1);
                    indices.push(b, b + 1, a + 1);
                }
            }

            const geo = new THREE.BufferGeometry();
            geo.setIndex(indices);
            geo.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
            geo.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
            geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
            return geo;
        }

        const trunkGeo = createTaperedTube(trunkCurve, 0.18, 0.08, 10, 8);
        const trunkMesh = new THREE.Mesh(trunkGeo, trunkMaterial);
        trunkMesh.castShadow = true;
        trunkMesh.receiveShadow = true;
        treeGroup.add(trunkMesh);

        // Sample trunk positions for trunk particles
        for (let i = 0; i < 40; i++) {
            const t = Math.random();
            const p = trunkCurve.getPoint(t);
            trunkOrigins.push({ pos: p.clone(), depth: 0 });
        }

        // Short hidden branches inside the canopy — just enough for structure
        function addBranch(start, end, radiusStart, radiusEnd, depth) {
            const mid = start.clone().add(end).multiplyScalar(0.5);
            const perp = new THREE.Vector3(
                (Math.random() - 0.5) * 0.1,
                (Math.random() - 0.5) * 0.05,
                (Math.random() - 0.5) * 0.1
            );
            const ctrl = mid.clone().add(perp);
            const curve = new THREE.QuadraticBezierCurve3(start, ctrl, end);

            const tubeGeo = new THREE.TubeGeometry(curve, 5, radiusStart, 6, false);
            const tubeMesh = new THREE.Mesh(tubeGeo, trunkMaterial);
            tubeMesh.castShadow = true;
            treeGroup.add(tubeMesh);

            // Sample positions along branch for particles
            for (let s = 0; s < 4; s++) {
                const pt = curve.getPoint(s / 4);
                trunkOrigins.push({ pos: pt, depth: depth });
            }
        }

        // Very short branches that are mostly INSIDE the canopy
        const trunkTop = new THREE.Vector3(0, TRUNK_HEIGHT, 0);
        const branchEnds = [
            new THREE.Vector3(-0.5, 2.1, 0.4),
            new THREE.Vector3(0.5, 2.2, -0.3),
            new THREE.Vector3(0.0, 2.5, 0.5),
            new THREE.Vector3(-0.3, 2.4, -0.5),
            new THREE.Vector3(0.3, 2.6, 0.0),
            new THREE.Vector3(0.0, 2.8, -0.2),
        ];
        branchEnds.forEach(end => {
            addBranch(trunkTop, end, 0.07, 0.03, 1);
        });

        // ========================================================
        // DENSE CANOPY — The dominant visual element
        // A large, compact, roughly spherical/dome blossom mass
        // sitting atop the short trunk. Blossoms overlap heavily.
        // ========================================================

        // Canopy center sits just above trunk top
        const CANOPY_CENTER_Y = 2.6;
        const CANOPY_RADIUS_X = 2.0;  // Wide
        const CANOPY_RADIUS_Y = 1.6;  // Somewhat tall
        const CANOPY_RADIUS_Z = 2.0;  // Wide

        // Dense spherical fill — generate MANY flower positions
        // These are packed tightly to create a continuous visual mass
        const BLOSSOM_COUNT = 4200; // Very dense
        const LEAF_COUNT = 600;

        function randomInEllipsoid(cx, cy, cz, rx, ry, rz) {
            // Uniform distribution inside ellipsoid
            const u = Math.random();
            const v = Math.random();
            const theta = u * 2 * Math.PI;
            const phi = Math.acos(2 * v - 1);
            const r = Math.cbrt(Math.random()); // Cube root for uniform volume
            return new THREE.Vector3(
                cx + r * rx * Math.sin(phi) * Math.cos(theta),
                cy + r * ry * Math.cos(phi),
                cz + r * rz * Math.sin(phi) * Math.sin(theta)
            );
        }

        // Shell-biased distribution to make the outer surface extra dense
        function randomOnEllipsoidShell(cx, cy, cz, rx, ry, rz, thickness) {
            const u = Math.random();
            const v = Math.random();
            const theta = u * 2 * Math.PI;
            const phi = Math.acos(2 * v - 1);
            const r = 1.0 - Math.random() * thickness; // near-surface
            return new THREE.Vector3(
                cx + r * rx * Math.sin(phi) * Math.cos(theta),
                cy + r * ry * Math.cos(phi),
                cz + r * rz * Math.sin(phi) * Math.sin(theta)
            );
        }

        // Fill the canopy volume densely
        // 70% shell (outer dense surface), 30% interior fill
        for (let i = 0; i < BLOSSOM_COUNT; i++) {
            let pos;
            if (i < BLOSSOM_COUNT * 0.65) {
                // Dense outer shell — creates the visible continuous surface
                pos = randomOnEllipsoidShell(0, CANOPY_CENTER_Y, 0, CANOPY_RADIUS_X, CANOPY_RADIUS_Y, CANOPY_RADIUS_Z, 0.25);
            } else {
                // Interior fill
                pos = randomInEllipsoid(0, CANOPY_CENTER_Y, 0, CANOPY_RADIUS_X * 0.85, CANOPY_RADIUS_Y * 0.85, CANOPY_RADIUS_Z * 0.85);
            }
            // Slight bottom clipping — blossoms shouldn't go below trunk top
            if (pos.y < TRUNK_HEIGHT - 0.1) pos.y = TRUNK_HEIGHT - 0.1 + Math.random() * 0.3;
            flowerOrigins.push({ pos: pos, depth: 2 });
        }

        // Scattered green leaf flecks mixed into canopy
        for (let i = 0; i < LEAF_COUNT; i++) {
            const pos = randomInEllipsoid(0, CANOPY_CENTER_Y, 0, CANOPY_RADIUS_X * 0.9, CANOPY_RADIUS_Y * 0.9, CANOPY_RADIUS_Z * 0.9);
            if (pos.y < TRUNK_HEIGHT - 0.1) pos.y = TRUNK_HEIGHT;
            leafOrigins.push({ pos: pos, depth: 2 });
        }

        // Tiny fallen petals on ground (decorative detail)
        for (let i = 0; i < 30; i++) {
            const ang = Math.random() * Math.PI * 2;
            const rad = 0.3 + Math.random() * 1.8;
            flowerOrigins.push({
                pos: new THREE.Vector3(Math.cos(ang) * rad, 0.08, Math.sin(ang) * rad),
                depth: 3
            });
        }

        // ========================================================
        // PARTICLE SYSTEM — Morph from tree to QR
        // ========================================================
        const TOTAL_PARTICLES = 5000;
        const particleGeo = new THREE.PlaneGeometry(0.14, 0.14); // Small quads

        const particleMat = new THREE.ShaderMaterial({
            uniforms: {
                uProgress: { value: 0.0 },
                uTime: { value: 0.0 }
            },
            vertexShader: `
                uniform float uProgress;
                uniform float uTime;

                attribute vec3 aTreePos;
                attribute vec3 aQRPos;
                attribute vec3 aSwirl;
                attribute float aDelay;
                attribute float aTreeScale;
                attribute float aQRScale;
                attribute vec3 aTreeColor;
                attribute vec3 aQRColor;
                attribute float aType;
                attribute float aRotation;

                varying vec3 vColor;
                varying float vProgress;
                varying float vType;
                varying vec2 vUv;

                float easeOutCubic(float x) {
                    return 1.0 - pow(1.0 - x, 3.0);
                }

                void main() {
                    vUv = uv;
                    vType = aType;

                    float localP = clamp((uProgress - aDelay) / (1.0 - aDelay), 0.0, 1.0);
                    float easedP = easeOutCubic(localP);
                    vProgress = easedP;

                    vec3 treeP = aTreePos;
                    // Gentle canopy sway when in tree state
                    if (uProgress < 0.15) {
                        float swayForce = (1.0 - uProgress / 0.15);
                        float h = aTreePos.y;
                        treeP.x += sin(uTime * 0.8 + h * 0.5 + aTreePos.z) * 0.03 * swayForce * h * 0.3;
                        treeP.z += cos(uTime * 0.6 + h * 0.4) * 0.02 * swayForce * h * 0.3;
                    }

                    float arch = sin(localP * 3.14159265);
                    vec3 swirlOffset = aSwirl * arch * (1.0 - localP * 0.5);
                    vec3 currentPos = mix(treeP, aQRPos, easedP) + swirlOffset;

                    float currentScale = mix(aTreeScale, aQRScale, easedP);
                    vColor = mix(aTreeColor, aQRColor, clamp(easedP * 1.3, 0.0, 1.0));

                    vec3 transformed = position * currentScale;
                    float currentRot = aRotation * (1.0 - easedP);
                    float c = cos(currentRot), s = sin(currentRot);
                    mat2 rotMat = mat2(c, -s, s, c);
                    transformed.xy = rotMat * transformed.xy;

                    if (easedP < 0.90) {
                        vec4 billboard = modelViewMatrix * vec4(currentPos, 1.0);
                        billboard.xy += transformed.xy;
                        vec4 fixedPlane = modelViewMatrix * vec4(currentPos + transformed, 1.0);
                        gl_Position = projectionMatrix * mix(billboard, fixedPlane, easedP);
                    } else {
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(currentPos + vec3(transformed.xy, 0.0), 1.0);
                    }
                }
            `,
            fragmentShader: `
                uniform float uProgress;
                varying vec3 vColor;
                varying float vProgress;
                varying float vType;
                varying vec2 vUv;

                float getSakuraDist(vec2 p) {
                    float r = length(p);
                    if (r > 0.48) return 1.0;
                    float angle = atan(p.y, p.x);
                    float petal = cos(5.0 * angle);
                    float petalR = 0.20 + 0.22 * (0.5 + 0.5 * petal);
                    float notch = 0.03 * cos(10.0 * angle);
                    return r - (petalR - notch);
                }

                float getLeafDist(vec2 p) {
                    float yNorm = (p.y + 0.46) / 0.92;
                    if (yNorm < 0.0 || yNorm > 1.0) return 1.0;
                    float maxWidth = 0.28 * sin(yNorm * 3.14159265) * (1.0 - 0.2 * yNorm);
                    return abs(p.x) - maxWidth;
                }

                void main() {
                    vec2 p = vUv - vec2(0.5);

                    if (vProgress > 0.85) {
                        // Settling into QR — fade to opaque square
                        float alpha = max(0.0, 1.0 - (vProgress - 0.85) / 0.15);
                        gl_FragColor = vec4(vColor, alpha);
                    } else if (vProgress < 0.12) {
                        // Tree state — shaped particles
                        if (vType > 0.5 && vType < 1.5) {
                            // Leaf
                            if (getLeafDist(p) > 0.0) discard;
                            float vein = smoothstep(0.015, 0.0, abs(p.x));
                            gl_FragColor = vec4(mix(vColor, vColor * 1.2, vein * 0.3), 1.0);
                        } else if (vType < 0.5) {
                            // Sakura blossom
                            if (getSakuraDist(p) > 0.0) discard;
                            float centerR = length(p);
                            if (centerR < 0.07) {
                                gl_FragColor = vec4(0.98, 0.85, 0.35, 1.0); // Golden pistil
                            } else {
                                vec3 petalColor = mix(vColor, vec3(1.0, 0.95, 0.97), smoothstep(0.08, 0.40, centerR) * 0.3);
                                gl_FragColor = vec4(petalColor, 1.0);
                            }
                        } else {
                            // Wood / trunk particle
                            if (length(p) > 0.38) discard;
                            gl_FragColor = vec4(vColor, 1.0);
                        }
                    } else {
                        // Morphing — rounded rect → square
                        float morph = (vProgress - 0.12) / 0.73;
                        float cornerRadius = mix(0.38, 0.01, morph);
                        vec2 d = abs(p) - vec2(0.48 - cornerRadius);
                        if (length(max(d, 0.0)) + min(max(d.x, d.y), 0.0) - cornerRadius > 0.0) discard;
                        gl_FragColor = vec4(vColor, 1.0);
                    }
                }
            `,
            transparent: true,
            side: THREE.DoubleSide
        });

        const instancedGeo = new THREE.InstancedBufferGeometry();
        instancedGeo.index = particleGeo.index;
        instancedGeo.attributes.position = particleGeo.attributes.position;
        instancedGeo.attributes.uv = particleGeo.attributes.uv;

        const aTreePos = new Float32Array(TOTAL_PARTICLES * 3);
        const aQRPos = new Float32Array(TOTAL_PARTICLES * 3);
        const aSwirl = new Float32Array(TOTAL_PARTICLES * 3);
        const aDelay = new Float32Array(TOTAL_PARTICLES);
        const aTreeScale = new Float32Array(TOTAL_PARTICLES);
        const aQRScale = new Float32Array(TOTAL_PARTICLES);
        const aTreeColor = new Float32Array(TOTAL_PARTICLES * 3);
        const aQRColor = new Float32Array(TOTAL_PARTICLES * 3);
        const aType = new Float32Array(TOTAL_PARTICLES);
        const aRotation = new Float32Array(TOTAL_PARTICLES);

        const SAKURA_COLORS = [
            new THREE.Color(0xffb7c5),
            new THREE.Color(0xffc2d1),
            new THREE.Color(0xffaabb),
            new THREE.Color(0xffd0dd),
            new THREE.Color(0xffa0b4),
            new THREE.Color(0xffccd5),
            new THREE.Color(0xffe0e8),
        ];

        const LEAF_COLORS = [
            new THREE.Color(0x3a8a3e),
            new THREE.Color(0x45a048),
            new THREE.Color(0x558b2f),
            new THREE.Color(0x6a9f3a)
        ];

        const WOOD_COLORS = [
            new THREE.Color(0x4a3728),
            new THREE.Color(0x3d2817),
            new THREE.Color(0x5c4033)
        ];

        function computeQRWorldPositions() {
            const vHeight = 2.0 * CAM_QR_Z * Math.tan(THREE.MathUtils.degToRad(camera.fov * 0.5));
            const containerRect = qrCardContainer.getBoundingClientRect();
            const qrCardWorldSize = (containerRect.width / window.innerHeight) * vHeight;

            const quietModules = 4;
            const totalModulesWithQuiet = qrSize + (quietModules * 2);
            const qrMatrixWorldSize = qrCardWorldSize * (qrSize / totalModulesWithQuiet);
            const moduleStep = qrMatrixWorldSize / qrSize;
            const qrHalf = qrMatrixWorldSize / 2;

            for (let i = 0; i < TOTAL_PARTICLES; i++) {
                const targetMod = qrDarkModules[i % qrDarkModules.length];
                const qrX = -qrHalf + (targetMod.c + 0.5) * moduleStep;
                const qrY = qrHalf - (targetMod.r + 0.5) * moduleStep;

                aQRPos[i * 3 + 0] = qrX;
                aQRPos[i * 3 + 1] = qrY;
                aQRPos[i * 3 + 2] = 0.0;
                aQRScale[i] = (moduleStep / 0.14) * 1.04;
            }

            if (instancedGeo.attributes.aQRPos) {
                instancedGeo.attributes.aQRPos.needsUpdate = true;
                instancedGeo.attributes.aQRScale.needsUpdate = true;
            }
        }

        // Populate particles
        for (let i = 0; i < TOTAL_PARTICLES; i++) {
            let treeP, treeColor, delay, baseScale, type;

            if (i < TOTAL_PARTICLES * 0.82 && flowerOrigins.length > 0) {
                // Majority: sakura blossoms
                const item = flowerOrigins[Math.floor(Math.random() * flowerOrigins.length)];
                treeP = item.pos;
                treeColor = SAKURA_COLORS[Math.floor(Math.random() * SAKURA_COLORS.length)];
                delay = Math.pow(Math.random(), 2.0) * 0.10;
                baseScale = 0.45 + Math.random() * 0.35;
                type = 0.0;
            } else if (i < TOTAL_PARTICLES * 0.92 && leafOrigins.length > 0) {
                // Leaves
                const item = leafOrigins[Math.floor(Math.random() * leafOrigins.length)];
                treeP = item.pos;
                treeColor = LEAF_COLORS[Math.floor(Math.random() * LEAF_COLORS.length)];
                delay = 0.05 + Math.random() * 0.10;
                baseScale = 0.40 + Math.random() * 0.30;
                type = 1.0;
            } else if (trunkOrigins.length > 0) {
                // Wood
                const item = trunkOrigins[Math.floor(Math.random() * trunkOrigins.length)];
                treeP = item.pos;
                treeColor = WOOD_COLORS[Math.floor(Math.random() * WOOD_COLORS.length)];
                delay = 0.10 + Math.random() * 0.12;
                baseScale = 0.35 + Math.random() * 0.25;
                type = 2.0;
            } else {
                treeP = new THREE.Vector3(0, 2, 0);
                treeColor = SAKURA_COLORS[0];
                delay = 0.05;
                baseScale = 0.40;
                type = 0.0;
            }

            aTreePos[i * 3 + 0] = treeP.x;
            aTreePos[i * 3 + 1] = treeP.y;
            aTreePos[i * 3 + 2] = treeP.z;

            // Swirl — outward spiral during morph
            const angle = Math.atan2(treeP.z, treeP.x) + (Math.random() - 0.5) * 1.5;
            const swirlRadius = 1.5 + Math.random() * 3.0;
            aSwirl[i * 3 + 0] = Math.cos(angle) * swirlRadius;
            aSwirl[i * 3 + 1] = (Math.random() - 0.5) * 2.0;
            aSwirl[i * 3 + 2] = Math.sin(angle) * swirlRadius + 0.8;

            aDelay[i] = delay;
            aTreeScale[i] = baseScale;
            aType[i] = type;

            aTreeColor[i * 3 + 0] = treeColor.r;
            aTreeColor[i * 3 + 1] = treeColor.g;
            aTreeColor[i * 3 + 2] = treeColor.b;

            const targetMod = qrDarkModules[i % qrDarkModules.length];
            const qrC = targetMod.theme.threeColor;
            aQRColor[i * 3 + 0] = qrC.r;
            aQRColor[i * 3 + 1] = qrC.g;
            aQRColor[i * 3 + 2] = qrC.b;

            aRotation[i] = Math.random() * Math.PI * 2;
        }

        instancedGeo.setAttribute('aTreePos', new THREE.InstancedBufferAttribute(aTreePos, 3));
        instancedGeo.setAttribute('aQRPos', new THREE.InstancedBufferAttribute(aQRPos, 3));
        instancedGeo.setAttribute('aSwirl', new THREE.InstancedBufferAttribute(aSwirl, 3));
        instancedGeo.setAttribute('aDelay', new THREE.InstancedBufferAttribute(aDelay, 1));
        instancedGeo.setAttribute('aTreeScale', new THREE.InstancedBufferAttribute(aTreeScale, 1));
        instancedGeo.setAttribute('aQRScale', new THREE.InstancedBufferAttribute(aQRScale, 1));
        instancedGeo.setAttribute('aTreeColor', new THREE.InstancedBufferAttribute(aTreeColor, 3));
        instancedGeo.setAttribute('aQRColor', new THREE.InstancedBufferAttribute(aQRColor, 3));
        instancedGeo.setAttribute('aType', new THREE.InstancedBufferAttribute(aType, 1));
        instancedGeo.setAttribute('aRotation', new THREE.InstancedBufferAttribute(aRotation, 1));

        computeQRWorldPositions();

        const particleMesh = new THREE.Mesh(instancedGeo, particleMat);
        particleMesh.frustumCulled = false;
        scene.add(particleMesh);

        // ========================================================
        // ANIMATION STATE MACHINE
        // ========================================================
        let state = "tree"; // "tree" | "morphing_to_qr" | "qr" | "morphing_to_tree"
        let animProgress = 0.0;
        let animStartTime = null;
        let rafId = null;

        function easeOutCubic(x) {
            return 1.0 - Math.pow(1.0 - x, 3.0);
        }

        function animate(timestamp) {
            const time = timestamp * 0.001;

            if (animStartTime !== null) {
                const elapsed = timestamp - animStartTime;
                let p = Math.min(1.0, elapsed / ANIM_DURATION);

                if (state === "morphing_to_qr") {
                    animProgress = p;
                    if (p >= 1.0) {
                        animProgress = 1.0;
                        state = "qr";
                        animStartTime = null;
                        qrCardContainer.classList.add("qr-visible");
                    }
                } else if (state === "morphing_to_tree") {
                    animProgress = 1.0 - p;
                    if (p >= 1.0) {
                        animProgress = 0.0;
                        state = "tree";
                        animStartTime = null;
                    }
                }
            }

            const t = animProgress;
            const easedT = easeOutCubic(t);

            // Shader uniforms
            particleMat.uniforms.uProgress.value = t;
            particleMat.uniforms.uTime.value = time;

            // Camera transition: isometric → top-down
            camera.position.lerpVectors(camPosTree, camPosQR, easedT);
            const currentLook = new THREE.Vector3().lerpVectors(camLookTree, camLookQR, easedT);
            camera.lookAt(currentLook);

            // Dissolve 3D tree geometry during morph
            const treeScale = Math.max(0.0001, 1.0 - t * 1.5);
            treeGroup.scale.set(treeScale, treeScale, treeScale);
            treeGroup.position.y = -t * 1.5;

            groundGroup.position.y = -t * 5.0;
            groundGroup.scale.set(treeScale, treeScale, treeScale);

            // QR card reveal during final phase
            if (t >= 0.80) {
                qrCardContainer.classList.add("qr-visible");
            } else if (state === "morphing_to_tree" || t < 0.80) {
                qrCardContainer.classList.remove("qr-visible");
            }

            renderer.render(scene, camera);

            if (state === "morphing_to_qr" || state === "morphing_to_tree" || state === "tree") {
                rafId = requestAnimationFrame(animate);
            } else if (state === "qr") {
                cancelAnimationFrame(rafId);
                rafId = null;
            }
        }

        // Tap/Click Interaction
        function handleInteraction() {
            const now = performance.now();
            if (state === "tree" || state === "morphing_to_tree") {
                state = "morphing_to_qr";
                animStartTime = now - (animProgress * ANIM_DURATION);
                if (!rafId) rafId = requestAnimationFrame(animate);
            } else if (state === "qr" || state === "morphing_to_qr") {
                state = "morphing_to_tree";
                qrCardContainer.classList.remove("qr-visible");
                animStartTime = now - ((1.0 - animProgress) * ANIM_DURATION);
                if (!rafId) rafId = requestAnimationFrame(animate);
            }
        }

        wrapper.addEventListener("pointerdown", function(e) {
            e.preventDefault();
            handleInteraction();
        });

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            computeQRWorldPositions();
            renderExact2DQR();
            if (state === "qr") {
                renderer.render(scene, camera);
            }
        }
        window.addEventListener("resize", onResize);

        // Initial Layout & Start
        renderExact2DQR();
        rafId = requestAnimationFrame(animate);
    })();
    </script>
</body>
</html>
