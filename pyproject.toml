[build-system]
requires = ['setuptools>=61.0']
build-backend = 'setuptools.build_meta'

[project]
name = 'churnlens'
version = '2.0.0'
dependencies = [
    'fastapi',
    'uvicorn',
    'pydantic',
    'python-dotenv>=1.0,<2',
    'emoji',
    'contractions',
    'torch',
    'transformers>=5.17.0,<6.0.0',
    'huggingface-hub>=1.0.0,<2.0.0',
]
